[metadata]
name = autonima
version = 0.1.0
author = Alejandro de la Vega
author_email = delavega@utexas.edu
license = MIT
description = LLM-powered automated systematic review and meta-analysis
keywords =
    systematic-review
    meta-analysis
    neuroimaging
    pubmed
    llm
    ai
    literature-search
    prisma
    evidence-synthesis
url = https://github.com/neurostuff/autonima
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering :: Bio-Informatics
    Topic :: Scientific/Engineering :: Medical Science Apps.
project_urls =
    Documentation = https://neurostuff.github.io/autonima/
    Source = https://github.com/neurostuff/autonima
    Tracker = https://github.com/neurostuff/autonima/issues

[options]
packages = find:
install_requires =
    pyyaml>=6.0
    pydantic>=2.0
    click>=8.0
    requests>=2.28.0
    typing-extensions>=4.0
    biopython>=1.81
    pandas>=2.0
    pubget>=0.0.9
    beautifulsoup4>=4.9.0
    lxml>=4.6.0
    tqdm>=4.60
include_package_data = True
python_requires = >=3.10

[options.packages.find]
exclude = tests*; examples*

[options.entry_points]
console_scripts = autonima=autonima.cli:main

[options.extras_require]
dev =
    pytest>=7.0
    pytest-asyncio>=0.21.0
    black>=22.0
    flake8>=5.0
    mypy>=1.0
    pre-commit>=3.0
llm = openai>=1.0
readability = readabilipy>=0.2.0
meta = nimare>=0.11.0
docs =
    mkdocs>=1.6
    mkdocs-material>=9.5
    mkdocs-click>=0.8
    pymdown-extensions>=10.0
ui = fastapi>=0.115; uvicorn>=0.30

[options.package_data]
autonima = py.typed
autonima.templates = *.yml
autonima.webui =
    static/*.html
    static/*.css
    static/*.jsx
