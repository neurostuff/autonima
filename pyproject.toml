[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "autonima"
version = "0.1.0"
authors = [{name = "Alejandro de la Vega", email = "delavega@utexas.edu"}]
license = {text = "MIT"}
description = "LLM-powered automated systematic review and meta-analysis"
keywords = [
    "systematic-review",
    "meta-analysis",
    "neuroimaging",
    "pubmed",
    "llm",
    "ai",
    "literature-search",
    "prisma",
    "evidence-synthesis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "click>=8.0",
    "requests>=2.28.0",
    "typing-extensions>=4.0",
    "biopython>=1.81",
    "pandas>=2.0",
    "pubget>=0.0.9",
    "beautifulsoup4>=4.9.0",
    "lxml>=4.6.0",
    "tqdm>=4.60",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/neurostuff/autonima"
Documentation = "https://neurostuff.github.io/autonima/"
Source = "https://github.com/neurostuff/autonima"
Tracker = "https://github.com/neurostuff/autonima/issues"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
readability = ["readabilipy>=0.2.0"]
meta = ["nimare>=0.11.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-click>=0.8",
    "pymdown-extensions>=10.0",
]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
autonima = "autonima.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests*"] # examples*
namespaces = false

[tool.setuptools.package-data]
autonima = ["py.typed"]
"autonima.templates" = ["*.yml"]
"autonima.webui" = [
    "static/*.html",
    "static/*.css",
    "static/*.jsx",
]
