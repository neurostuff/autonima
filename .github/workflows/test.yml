name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is intentionally absent: it is broken upstream, not here.
        # pubget caps joblib at <=1.1.1, whose distutils import 3.12 removed,
        # and the scikit-learn resolved through the same chain imports
        # ComplexWarning from numpy.core.numeric, which numpy 2.0 removed.
        # Restore 3.12 (and add 3.13) once those caps are relaxed upstream.
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -e .[dev]
        pip install -e .[llm]
        pip install -e git+https://github.com/neuroquery/pubget.git#egg=pubget
        pip install --upgrade joblib


    - name: Run tests
      run: |
        pytest tests/ -v
      env:
        OPENAI_API_KEY: "fake-api-key-for-testing"
        OPENROUTER_API_KEY: "fake-api-key-for-testing"