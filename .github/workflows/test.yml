name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: ['highest']
        include:
          # The minimum the meta extra allows, on the oldest supported Python.
          - python-version: "3.11"
            resolution: 'lowest-direct'
          # NiMARE 0.21.x changed Studyset.slice and rejects coordinates without a space;
          # autonima meta selects on the NiMADS dicts so it must still fit there.
          - python-version: "3.12"
            resolution: 'highest'
            nimare: "0.21.0"

    env:
      UV_RESOLUTION: ${{ matrix.resolution }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: uv sync --extra llm,meta

    - name: Pin NiMARE
      if: matrix.nimare
      run: uv pip install "nimare==${{ matrix.nimare }}"

    - name: Run tests
      run: |
        uv run --no-sync pytest tests/ -v
      env:
        OPENAI_API_KEY: "fake-api-key-for-testing"
        OPENROUTER_API_KEY: "fake-api-key-for-testing"
