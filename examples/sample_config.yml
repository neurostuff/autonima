# Example Autonima pipeline specification
# Defines a systematic review according to PRISMA steps.
#
# This file is the canonical sample config used by:
# - `autonima create-sample-config`
# - the repository example config
# - the user documentation
#
# The standard path: candidates come from NeuroStore's search, and each one is reviewed from
# NeuroStore's record of it -- its analyses with the features NeuroStore extracted (contrast,
# task, whole brain or ROI, participants, design) -- in a single call that screens the study
# and selects its analyses (screening.fulltext.mode: combined). No article is read, and no
# table is parsed: the coordinates are NeuroStore's.
#
# Only studies NeuroStore has extracted features for are reviewed; the others are listed in
# outputs/documents_unavailable.csv with the reason. To review those from their articles
# instead, set retrieval.records.fallback: fulltext. To read every article in full, as
# autonima did before NeuroStore records existed, see docs/guides/records.md.

# Optional global defaults applied when stage-level values are omitted.
# defaults:
#   model: "gpt-5-mini-2025-08-07"

search:
  database: "neurostore"  # or "pubmed" to search all of PubMed
  # Option 1: Specify a search query, in PubMed syntax; NeuroStore translates it.
  query: "schizophrenia AND working memory AND fMRI"
  # Option 2: Provide a list of PMIDs directly.
  # pmids_list:
  #   - "12345678"
  #   - "23456789"
  #   - "34567890"
  # Option 3: Provide a file with one PMID per line.
  # pmids_file: "path/to/pmids.txt"
  max_results: 100
  # Optional date filtering, formatted as YYYY/MM/DD.
  # date_from: "2020/01/01"
  # date_to: "2024/12/31"
  email: "your.email@example.com"  # Study metadata is fetched from PubMed.
  # neurostore:  # Optional; see docs/guides/neurostore.md.
  #   search_full_text: false  # Also match the paper's text, not only title and abstract.

retrieval:
  load_excluded: false  # Load full texts for abstract-excluded studies too.
  # Where articles come from when one is read: with the fallback below, or without records.
  sources:
    - pubget
  records:
    # Review each study from NeuroStore's record of it instead of its article.
    enabled: true
    kind: "neurostore"
    # fallback: "fulltext"  # Review studies NeuroStore has coordinates but no features for
    #                       # from their articles (retrieved from the sources above).
  # full_text_sources:
  #   # Example: HTML files where the filename is the PMID.
  #   - root_path: "/path/to/your/html/files"
  #     pmid_source: "file_name"
  #     allowed_extensions: [".html"]
  #     # No processed_data_path is required. Autonima runs ACE automatically
  #     # and stores generated table artifacts under the run output.
  #     # An existing ACE export can optionally be reused:
  #     # processed_data_path: "/path/to/processed/ace_data"
  #
  #   # Example: folder-based structure with plain-text files.
  #   - root_path: "/path/to/your/first/full/texts"
  #     pmid_source: "folder_name"  # or "json" or "file_name"
  #     text_path_templates:
  #       - "fulltext.txt"
  #       - "text.txt"
  #     processed_data_path: "/path/to/processed/pubget_like_data"
  #
  #   # Example: folder-based structure with JSON metadata.
  #   - root_path: "/path/to/your/second/full/texts"
  #     pmid_source: "json"
  #     text_path_templates:
  #       - "processed/pubget/text.txt"
  #       - "text.txt"
  #     json_filename: "identifiers.json"
  #     json_pmid_key: "pmid"
  #     # Use coordinates_path_templates instead of processed_data_path when
  #     # coordinates live alongside each document source.
  #     # coordinates_path_templates:
  #     #   - "coordinates.json"
  #     processed_data_path: "/path/to/processed/pubget_like_data"
  # Records can also come from another tool (kind "text" or "analyses", with a root
  # folder); see docs/guides/records.md.

screening:
  abstract:
    model: "gpt-5-mini-2025-08-07"
    objective: "Identify fMRI studies of working memory in schizophrenia"
    inclusion_criteria:
      - Human participants
      - fMRI neuroimaging
      - Case-control or experimental design
      - Task-based working memory paradigm
    exclusion_criteria:
      - Animal studies
      - Review articles, meta-analyses, or theoretical papers
      - Non-fMRI imaging modalities (e.g., PET, EEG, MEG)
      - Studies without a control or comparison group
    # confidence_reporting: false  # Optional, default false.
    # threshold: 0.9  # Optional probability cutoff.
    # additional_instructions: "Pay special attention to sample sizes."
    # model_params:  # Optional. Passed through to the model API call. Not part of the stage
    #   reasoning_effort: "none"  # cache signature, so setting it does not force a re-screen.

  fulltext:
    model: "gpt-5-mini-2025-08-07"
    # One call per study screens it against these criteria and selects its analyses for
    # the annotations below. "separate" screens first and annotates in a second call.
    mode: "combined"
    objective: "Identify fMRI studies of working memory in schizophrenia"
    inclusion_criteria:
      - Human participants
      - fMRI neuroimaging
      - Case-control or experimental design
      - Task-based working memory paradigm
    exclusion_criteria:
      - Animal studies
      - Review articles, meta-analyses, or theoretical papers
      - Non-fMRI imaging modalities (e.g., PET, EEG, MEG)
      - Studies without a control or comparison group
    # confidence_reporting: false
    # threshold: 0.95
    # additional_instructions: "Focus on methodological rigor."
    # model_params:
    #   reasoning_effort: "none"  # Required by gpt-5.6-* when function tools are used.

parsing:
  # The records bring each study's analyses and coordinates, so no tables are parsed.
  # Without records, set true to parse them from the articles with coordinate_model.
  parse_coordinates: false

output:
  # Keep this non-empty. The CLI can override it with an explicit output folder
  # or default to a folder derived from the config filename.
  directory: "results"
  formats: ["csv", "json"]
  nimads: false
  export_excluded_studies: false

annotation:
  enabled: true
  model: "gpt-5-mini-2025-08-07"
  # model_params:  # Optional, same idea as screening's model_params.
  #   reasoning_effort: "none"
  # Options: "single_analysis" or "multi_analysis".
  prompt_type: "multi_analysis"
  create_all_included_annotations: true
  metadata_fields:
    - "analysis_name"
    - "analysis_description"
    - "table_caption"
    - "study_title"
    - "study_fulltext"  # The record (or article): how annotation reads each study.
  # Criteria every selected analysis must meet, on top of each annotation's own.
  inclusion_criteria:
    - "Whole-brain analysis"
  exclusion_criteria:
    - "Region-of-interest analyses"
  annotations:
    - name: "working_memory"
      description: "Working memory task-based analyses"
      inclusion_criteria:
        - "Analysis involves working memory tasks"
        - "Task-based fMRI with cognitive load manipulation"
      exclusion_criteria:
        - "Resting-state or passive viewing"
        - "Non-cognitive motor-only tasks"

